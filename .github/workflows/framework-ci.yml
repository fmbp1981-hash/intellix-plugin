name: IntelliX Framework

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  framework-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate framework and project contracts
        run: python3 framework/validate.py --all
      - name: Test validator behavior
        run: python3 -m unittest discover -s framework/tests -v
      - name: Compile validator
        run: python3 -m compileall -q framework
