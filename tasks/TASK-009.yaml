  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "the human selected process-level local Claude review for technical completion",
      "when": "the proposal defines evidence assurance",
      "then": "it labels review and controlling-session human action as local advisory evidence, never authenticated merge or production identity"
    },
    {
      "id": "AC-002",
      "given": "a completion candidate and a prior green revision",
      "when": "the proposed revision protocol is applied",
      "then": "it derives the current authorized worktree revision, rejects stale or uncommitted changes, binds review and live GitHub CI to that exact revision, and describes the status-commit CI boundary"
    },
    {
      "id": "AC-003",
      "given": "APPROVED releases downstream dependencies",
      "when": "approval evidence, contract, revision or post-status CI becomes invalid",
      "then": "the proposal requires downstream dispatch to fail closed rather than trusting an editable status label alone"
    },
    {
      "id": "AC-004",
      "given": "the current generic dispatcher and runtime transition interfaces",
      "when": "the proposal describes implementation boundaries",
      "then": "it forbids direct executor-requested APPROVED and reserves completion for a guarded path under the normative kernel"
    },
    {
      "id": "AC-005",
      "given": "this architectural proposal",
      "when": "its status and diff are reviewed",
      "then": "the ADR remains Proposed, only the two declared files changed, and no kernel, permission, credential, merge or production state changed"
    }
  ],
  "verification": [
