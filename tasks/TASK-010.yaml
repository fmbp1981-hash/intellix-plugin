    "level": "high",
    "reasons": [
      "The proposal defines future kernel invariants for automated decisions that can precede irreversible actions",
      "It sets where engine runtimes and credentials live, which affects secret handling on every operator machine",
      "It constrains transfer of customer text to an external engine under LGPD"
    ],
    "irreversible_actions": []
  },
  "ownership": {
    "architect": "claude",
    "executor": "claude",
    "reviewer": "codex",
    "domain_role": "architect"
  },
