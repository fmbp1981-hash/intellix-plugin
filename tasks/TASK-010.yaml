    },
    {
      "given": "phase skills would invoke the methodology",
      "id": "AC-002",
      "then": "phase changes happen only after acceptance and in the same Task Contract that versions the skill, so a clean checkout never references a missing capability",
      "when": "the ADR orders the work"
    },
    {
      "given": "vendor benchmarks, prices and latencies change between versions",
      "id": "AC-003",
      "then": "the normative reference contains no vendor number, dated engine facts live in an informative reference marked as claims, and numeric thresholds are configurable starting defaults",
      "when": "the ADR splits the method"
    },
    {
      "given": "two engines declare the same HTTP shape",
      "id": "AC-004",
      "then": "the port is vendor-neutral, adapters normalize and validate responses, and switching engines requires contract tests with real fixtures",
      "when": "the ADR defines the decision port"
    },
    {
      "given": "a small project with a semantic decision but no adoption signal",
      "id": "AC-005",
      "then": "no port or code is created and the outcome is recorded as not applicable or not adopted",
      "when": "the architecture phase applies the ADR"
    },
    {
      "given": "a decision whose text must stay in the environment",
      "id": "AC-006",
      "then": "only L0 rules, a local engine and humans are allowed; an external LLM is forbidden like an external engine",
      "when": "its fallback chain is defined"
    },
    {
      "given": "a calibrated decision",
      "id": "AC-007",
      "then": "the decision returns to shadow mode until a new calibration is approved",
      "when": "the model, weights, questions, options, temperature, preprocessing or policy change, or monitored drift exceeds bounds"
    },
