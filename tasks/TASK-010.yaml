  "dependencies": [],
  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "the decision-layer methodology exists only as a Claude skill in the operator's global configuration",
      "when": "the proposal defines the source of truth",
      "then": "it places the normative methodology in a vendor-neutral plugin reference that both adapters read and that cannot override the kernel, project contract, ADRs, Task Contracts or CI"
    },
    {
      "id": "AC-002",
      "given": "an automated decision whose downstream action is irreversible",
      "when": "the proposed registry and Task Contract rules are applied",
      "then": "no engine output can trigger that action automatically and the action stays behind the human gate"
    },
    {
      "id": "AC-003",
      "given": "a project that declares local-only data residency",
      "when": "a decision entry selects an external engine",
      "then": "the proposal defines that entry as invalid"
    },
    {
      "id": "AC-004",
      "given": "engine runtimes and credentials",
      "when": "the proposal defines their placement",
      "then": "they live at machine level outside any repository, the key is held in the OS keychain, nothing secret is written to repository, log or runtime record, and provisioning requires explicit human authorization"
    },
    {
      "id": "AC-005",
      "given": "this architectural proposal",
      "when": "its status and diff are reviewed",
      "then": "the ADR remains Proposed until an explicit human decision and changes no kernel, schema, policy, credential, merge or production state"
    },
    {
      "id": "AC-006",
      "given": "the engine was considered for decisions inside the IntelliX development workflow",
      "when": "the proposal decides its use there",
      "then": "it records non-adoption with the rationale and lists the invariants any future proposal must satisfy: advisory only, never in a blocking path or the authority chain, ratchet upward only, fail open within a fixed time budget, local by default"
    },
    {
      "id": "AC-007",
      "given": "a new or existing project reaching PRD, architecture or agent-creation",
      "when": "the phase runs",
      "then": "the proposal requires an explicit evaluation of the decision layer with its outcome recorded, including 'not applicable', so the evaluation cannot be skipped silently"
    }
  ],
  "verification": [
    {
      "command": "python3 framework/validate.py --root . --all",
      "proves": "The new Task Contract and repository artifacts validate"
    },
    {
      "command": "python3 -m unittest discover -s framework/tests -p 'test_*.py' -v",
      "proves": "No framework behavior regressed"
    },
