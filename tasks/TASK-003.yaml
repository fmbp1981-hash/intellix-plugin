  "acceptance_criteria": [
    {"id": "AC-001", "given": "an explicit executor or project default", "when": "dispatch is requested", "then": "the resolver selects only an installed permitted adapter and records the decision"},
    {"id": "AC-002", "given": "a legacy Claude-only project without Codex", "when": "/execute runs and project policy permits Claude", "then": "Claude continues implementing rather than producing a dead-end handoff"},
    {"id": "AC-003", "given": "an illegal transition, dependency, fileset or gate failure", "when": "progression is requested", "then": "the task is blocked with a durable reason"},
    {"id": "AC-004", "given": "review findings", "when": "changes are required", "then": "IN_REVIEW returns to IN_PROGRESS without inventing merge/release states"}
  ],
  "verification": [
    {"command": "python3 framework/validate.py --root . --all", "proves": "Contracts and lifecycle configuration validate"},
    {"command": "python3 framework/sync.py --source-root . --target-root . --check", "proves": "The pinned kernel and control-plane snapshot have no drift"},
    {"command": "python3 -m unittest discover -s framework/tests -v", "proves": "Resolver, fallback and transition negative paths are covered"},
    {"command": "python3 -m compileall -q framework", "proves": "Dispatcher and runtime compile"},
    {"command": "git diff --check", "proves": "The scoped patch has no whitespace errors"}
  ],
  "gates": ["schema", "fileset", "lint", "tests", "security_review", "independent_review", "rollback_plan", "human_approval", "worktree"],
  "rollback": "Revert dispatcher/runtime changes and restore the previous manual command behavior while retaining Task Contracts.",
  "notes": [
    "The dispatcher is deterministic control code, not an autonomous agent.",
    "Human identity is never inferred from a CLI actor string.",
    "Human architecture decision: preserve the normative framework lifecycle and automate only READY to IN_PROGRESS, IN_PROGRESS to IN_REVIEW, IN_REVIEW to IN_PROGRESS for findings, and applicable states to BLOCKED.",
    "Human architecture decision: APPROVED, merge, release and deploy are never automated by this task; ADR-0002 remains Proposed.",
    "Human architecture decision: durable records live under the project-declared .intellix/runtime path; project bindings declare default and permitted adapters plus explicit current-adapter fallback policy.",
    "Human architecture decision: installed adapter capability is detected at runtime and underscore gate IDs in the kernel are canonical for this task; role gate-name drift remains a later gap.",
    "Human architecture decision: distributed control-plane files are pinned so consumer drift is detectable."
  ],
