  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "an owned plugin checkout contains repository-only files under framework/tests and docs/adr",
      "when": "doctor scans authored runtime content",
      "then": "those repository-only trees are excluded from textual runtime-reference checks while actual skills, commands, agents, hooks and references remain checked"
    },
    {
      "id": "AC-002",
      "given": "a test fixture contains invalid intellix namespace references and missing references paths under framework/tests or docs/adr",
      "when": "doctor --strict runs",
      "then": "it exits cleanly and regression tests prove both exclusions"
    },
    {
      "id": "AC-003",
      "given": "the same invalid references appear in a runtime-loaded skill or plugin reference",
      "when": "doctor --strict runs",
      "then": "existing tests still prove the defects are reported"
    },
    {
      "id": "AC-004",
      "given": "this is a released plugin correction",
      "when": "version metadata is inspected",
      "then": "plugin.json, marketplace.json and metodologia.yaml all declare 3.2.1 and no other metadata field changes"
    },
    {
      "id": "AC-005",
      "given": "the installed live environment after sync",
      "when": "doctor --strict runs",
      "then": "the four 3.2.0 false positives are absent; unrelated user-owned duplicate skills may remain reported and are not modified by this task"
    },
    {
      "id": "AC-006",
      "given": "TASK-011 introduced a coordinated-version integration test at 3.2.0",
      "when": "a later compatible patch release changes all three coordinated fields",
      "then": "the test requires equality and a semantic version at least 3.2.0 instead of freezing the repository forever at exactly 3.2.0"
    }
  ],
  "verification": [
    {"command": "python3 framework/validate.py --root . --task tasks/TASK-012.yaml", "proves": "Task contract and fileset validate"},
    {"command": "python3 -m unittest discover -s global-config/scripts/tests -p 'test_*.py' -v", "proves": "Doctor and global configuration behavior pass, including new regressions"},
    {"command": "python3 -m unittest discover -s framework/tests -p 'test_*.py' -v", "proves": "Framework and decision-layer integration do not regress"},
    {"command": "python3 framework/validate.py --root . --all", "proves": "All repository contracts validate"},
    {"command": "python3 framework/sync.py --source-root . --target-root . --check", "proves": "Pinned distribution remains synchronized"},
    {"command": "bash hooks/scripts/validate-hooks.sh .", "proves": "Hook wiring remains valid"},
    {"command": "git diff --check", "proves": "The patch has no whitespace errors"}
  ],
  "rollback": "Revert the TASK-012 commits, restore the three version fields to 3.2.0, reinstall intellix@intellix-plugin 3.2.0, and restore the pre-sync global-config backup. No user-owned skill is changed.",
  "handoff": {
    "required_evidence": [
      "changed-file inventory",
      "new doctor regression results",
      "full framework and global-config test results",
      "exact-revision CI",
      "independent review",
      "human technical-completion approval"
    ],
    "open_questions": []
  },
  "notes": [
    "Created as a corrective patch after post-install verification of 3.2.0 exposed four false positives from repository-only ADR and framework test content.",
    "The operator repeatedly authorized continuation, publication and configuration sync; this READY contract authorizes only the reversible patch implementation. Release still follows exact-revision CI and independent review.",
    "The pre-existing loose impeccable skill is outside this task and must not be deleted or edited.",
    "The unregistered 3.0.6 cache is installation residue and is handled separately from source changes.",
    "The framework integration test was added to modify scope after the initial verification exposed its exact-3.2.0 assertion; changing it is necessary for AC-004 and retains the original coordinated-version guarantee."
  ]
}
