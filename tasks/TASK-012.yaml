{
  "id": "TASK-012",
  "title": "Prevent doctor runtime scans from linting repository-only tests and ADRs",
  "objective": "Fix the post-install doctor false positives exposed by IntelliX 3.2.0, add regression coverage, and coordinate the patch version 3.2.1 without changing decision-layer behavior or user-owned skills.",
  "status": "IN_PROGRESS",
  "source": {
    "prd": "README.md",
    "architecture": "docs/architecture/MULTIAGENT-FRAMEWORK.md",
    "spec": "docs/architecture/FRAMEWORK-SPEC.md",
    "adrs": ["docs/adr/0003-technical-completion-trust-and-revisions.md", "docs/adr/0004-typed-decision-layer.md"]
  },
  "dependencies": ["TASK-011"],
  "ownership": {
    "architect": "claude",
    "domain_role": "platform-engineer",
    "executor": "codex",
    "reviewer": "claude"
  },
  "risk": {
    "level": "medium",
    "reasons": [
