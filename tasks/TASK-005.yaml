  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "a CI run for another revision, an absent check or a failed required job",
      "when": "approval is evaluated",
      "then": "the task remains blocked"
    },
    {
      "id": "AC-002",
      "given": "a fresh checkout on Linux or macOS",
      "when": "the workflow runs",
      "then": "contract, runtime, adapter, hook and pilot checks execute"
    },
    {
      "id": "AC-003",
      "given": "a pilot with injected collision, failed CI and missing approval",
      "when": "the end-to-end suite runs",
      "then": "each failure blocks progression and a valid path produces a handoff"
    },
    {
      "id": "AC-004",
      "given": "a new task",
      "when": "the documented plan and execute commands are used",
      "then": "they invoke the runtime and keep issues compatibility limited to migration"
    }
  ],
  "verification": [
    {
      "command": "python3 framework/validate.py --all",
      "proves": "Framework and task validation"
    },
    {
      "command": "python3 -m unittest discover -s framework/tests -v",
      "proves": "Positive and negative regression coverage"
    },
    {
      "command": "python3 -m compileall -q framework",
      "proves": "Python syntax; this is not a lint substitute"
    },
    {
      "command": "bash hooks/scripts/validate-hooks.sh .",
      "proves": "Hook compatibility"
    }
  ],
  "gates": [
    "schema",
    "fileset",
    "lint",
    "tests",
    "security_review",
    "independent_review",
    "rollback_plan",
    "human_approval",
    "worktree"
  ],
  "rollback": "Revert the task implementation commit on the authorized feature branch after approval, preserve evidence and rerun baseline checks. No reset, production or data migration.",
  "notes": [
    "Draft planning only; accept ADR-0002 and resolve its identity decision before promoting this task to READY.",
