  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "the canonical kernel",
      "when": "lifecycle policy is loaded",
      "then": "dependency-satisfying states and guarded transition states are declared once as non-empty sets of known lifecycle states, and every dependency-satisfying state is also guarded"
    },
    {
      "id": "AC-002",
      "given": "the generic dispatcher or generic runtime transition API",
      "when": "an executor requests APPROVED, MERGED, VERIFIED, RELEASED or any later kernel-listed guarded state",
      "then": "the request is rejected before dependency, adapter or worktree activity even if a transition edge is present, and no transition record or task-state mutation, including BLOCKED, is written"
    },
    {
      "id": "AC-003",
      "given": "a dependency in a lifecycle state",
      "when": "the dispatcher checks whether it can release downstream work",
      "then": "it reads the dependency-satisfying set from the canonical kernel, and an absent, empty or malformed registry blocks without a duplicated code fallback"
    },
    {
      "id": "AC-004",
      "given": "CI evaluation receives an empty, malformed or unavailable required-check set despite normal project validation",
      "when": "eligibility executes",
      "then": "the result is indeterminate and blocking without querying GitHub or returning eligible"
    },
    {
      "id": "AC-005",
      "given": "the accepted ADR-0003",
      "when": "the TASK-008 diff is reviewed",
      "then": "no IN_REVIEW to APPROVED edge, approval record, local-human CLI shortcut, merge authority or production authority is introduced"
    }
  ],
  "verification": [
    {
      "command": "python3 framework/validate.py --root . --all",
      "proves": "Kernel registries, project bindings and all Task Contracts remain valid"
    },
    {
      "command": "python3 -m unittest discover -s framework/tests -p 'test_*.py' -v",
      "proves": "Positive and negative guard paths and all regressions pass"
    },
    {
      "command": "python3 -m compileall -q framework",
      "proves": "The Python control plane compiles"
    },
    {
      "command": "bash hooks/scripts/validate-hooks.sh .",
      "proves": "Claude adapter hooks remain valid"
    },
    {
      "command": "git diff --check",
      "proves": "The scoped diff has no whitespace defects"
    }
  ],
