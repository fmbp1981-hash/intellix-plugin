{
  "id": "TASK-008",
  "title": "Gate technical task completion without self-approval",
  "status": "DRAFT",
  "objective": "Provide a fail-closed technical-completion path from independent review to APPROVED without allowing an executor, editable record, or model opinion to satisfy CI, review, or human gates.",
  "source": {
    "prd": "README.md",
    "architecture": "docs/architecture/INTELLIX-TARGET-ARCHITECTURE.md",
    "spec": "docs/architecture/FRAMEWORK-SPEC.md",
    "adrs": ["docs/adr/0002-operational-orchestrator.md"]
  },
  "risk": {
    "level": "high",
    "reasons": [
      "Changes the normative task transition registry and technical approval gate",
      "An unguarded completion transition could enable executor self-approval or stale CI acceptance"
    ],
    "irreversible_actions": []
  },
  "ownership": {
    "architect": "claude",
    "executor": "codex",
    "reviewer": "claude-independent",
    "domain_role": "platform-engineer"
  },
  "scope": {
    "create": ["tasks/TASK-008.yaml"],
    "modify": [
      "framework/framework.yaml",
      "framework/runtime.py",
      "framework/dispatch.py",
      "framework/ci.py",
      "framework/schemas/approval.schema.json",
      "framework/schemas/runtime.schema.json",
      "framework/tests/test_runtime.py",
      "framework/tests/test_dispatch.py",
      "framework/README.md"
    ],
    "forbidden": [
      ".env*",
      "**/.env*",
      "issues/**",
      ".github/**",
      "global-config/**",
      "infra/production/**",
      "docs/adr/**"
    ]
  },
  "dependencies": ["TASK-006"],
  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "a task in IN_REVIEW with a complete independent reviewer handoff, eligible live GitHub CI for the exact implementation SHA, and explicit local human technical approval",
      "when": "technical completion is requested through the bounded control-plane path",
      "then": "the kernel-permitted transition to APPROVED is recorded with task, contract digest, revision, review and approval references"
    },
    {
      "id": "AC-002",
      "given": "missing, stale, failed or indeterminate CI, absent or self-produced review, stale contract digest, or absent explicit human action",
      "when": "technical completion is requested",
      "then": "the task remains unapproved and a specific blocking reason is recorded without a success-shaped fallback"
    },
    {
      "id": "AC-003",
      "given": "the generic dispatcher or runtime transition interface",
      "when": "an executor requests APPROVED directly or supplies an editable actor string or local evidence alone",
      "then": "the request is rejected and cannot bypass the guarded completion path"
    },
    {
      "id": "AC-004",
      "given": "technical task completion succeeds",
      "when": "merge, production, secrets, permissions or destructive operations are considered",
      "then": "APPROVED remains local technical state only and no external authenticated gate is treated as satisfied"
    },
    {
      "id": "AC-005",
      "given": "the approved fileset and existing ADR-0002 trust boundary",
      "when": "the diff and negative tests are reviewed",
      "then": "no adapter, schema, CLI flag or model output is promoted into independent normative or authenticated-human authority"
    }
  ],
  "verification": [
    {"command": "python3 framework/validate.py --root . --all", "proves": "The modified kernel and all Task Contracts validate"},
    {"command": "python3 -m unittest discover -s framework/tests -p 'test_*.py' -v", "proves": "Positive and negative completion-gate paths and regressions pass"},
    {"command": "python3 -m compileall -q framework", "proves": "The Python control plane compiles"},
    {"command": "bash hooks/scripts/validate-hooks.sh .", "proves": "Claude adapter hooks remain valid"},
    {"command": "git diff --check", "proves": "The scoped diff has no whitespace defects"}
  ],
  "gates": [
    "schema",
    "fileset",
    "lint",
    "tests",
    "security_review",
    "independent_review",
    "rollback_plan",
    "human_approval",
    "worktree"
  ],
  "rollback": "Revert only the focused TASK-008 implementation commits on the authorized feature branch; preserve review, CI, approval and runtime evidence. Do not rewrite history or alter external permissions.",
  "notes": [
    "Planning authorization was given on 2026-09-19; this DRAFT is not approval to change the kernel.",
    "ADR-0002 accepts local controlling-session human action for technical Task Contract completion as advisory evidence only. It does not authenticate merge or production approval.",
    "TASK-007 remains IN_REVIEW because the current kernel does not permit IN_REVIEW to APPROVED. This task must not depend on TASK-007, or it would deadlock the prerequisite it is intended to provide.",
    "The generic dispatcher currently accepts target_state; merely adding a kernel transition without guard checks would be unsafe.",
    "Re-use framework/ci.py exact-revision GitHub evaluation and existing handoff independence checks where possible. Do not treat editable local JSON as authenticated identity or CI.",
    "Independent read-only Claude architecture review on 2026-09-19 found three high-severity blockers: an unguarded dispatcher would permit direct APPROVED, caller-supplied revision could replay older green CI, and editable handoff JSON cannot prove reviewer provenance. Do not promote this task to READY on the current design.",
    "The provisional fileset may be insufficient for trusted revision derivation and evidence binding. Resolve the design first, then split the work or explicitly revise and reapprove the fileset; never expand it silently.",
    "APPROVED satisfies downstream dependencies, so a false positive has effects beyond a task status label. Failed completion must remain visibly blocked and must not release dependent tasks.",
    "Before READY, resolve the precise local human-action capture, independent-review provenance, final-SHA binding, revocation semantics and approval-evidence location with architecture and security review. Do not add a CLI --actor human shortcut.",
    "Use a dedicated same-branch worktree for implementation after the plan is explicitly approved. No merge, release, deploy, secrets, permission or production action is in scope."
  ],
  "handoff": {
    "required_evidence": [
      "independent architecture and security review of the gate design",
      "positive and negative transition tests",
      "validated fileset inventory",
      "exact-revision GitHub CI",
      "explicit local human technical decision"
    ],
    "open_questions": [
      "How will an explicit controlling-session human action be referenced and bound to task digest and implementation SHA without presenting the editable local record as authenticated identity?",
      "What is the accepted assurance level for independent Claude review: a process-level local review with explicit limits, or an externally authenticated reviewer identity?",
      "How will the control plane derive and verify the current implementation SHA against the reviewed branch tip instead of trusting a caller-supplied older SHA?",
      "Should an invalidated APPROVED state be revocable or cause downstream dependency checks to block, and where will that rule be normative?",
      "Which additional files and possibly separate architecture-decision task are required before this provisional fileset can become executable?"
    ]
  }
}
