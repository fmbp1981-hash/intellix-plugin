  "notes": [
    "Phase 1 completed at 7bef528 on 2026-09-22: canonical guarded-state registries, early generic dispatcher/runtime rejection and non-vacuous CI primitives passed 84 local tests, independent read-only Claude review and exact-revision GitHub checks. That evidence remains process/history context and does not authorize phase 2.",
    "The human owner explicitly approved this revised phase-2 exact fileset and acceptance criteria on 2026-09-23, authorizing implementation but not the later technical-completion decision, merge, release, deploy or production action.",
    "ADR-0003 is the accepted source of truth. The earlier one-time waiver and manual APPROVED-edit alternatives remain rejected because they bypass the guard being implemented.",
    "After plan approval, use the existing legal IN_REVIEW to IN_PROGRESS transition in this same dedicated worktree, commit that transition before implementation and bind the resulting phase base revision into the later review evidence.",
    "The completion API will be a control-plane library surface in framework/completion.py, not a target exposed by the generic dispatcher CLI. It may grant only APPROVED and only from IN_REVIEW after every gate passes; MERGED, VERIFIED and RELEASED remain outside this path.",
    "Versioned completion evidence is stored under tasks/evidence/ so a fresh checkout can validate it without adding a second configurable path. The review and approval records are created only after R is clean, pushed, independently reviewed and green; they are permitted completion metadata for A, not part of the executable implementation reviewed at R.",
    "R is derived from clean HEAD in the authorized worktree and must equal the live remote branch tip. A is never self-declared in its own content; downstream evaluation derives A from Git history after the guarded metadata commit and checks its exact live CI.",
    "The phase base to R diff must equal the reviewed implementation inventory and remain within this contract's create/modify files, excluding only the later task status and two versioned evidence records permitted in R-to-A.",
    "Current dependency eligibility revalidates schema, task pre/post digests, fileset digest, project binding, normative kernel/policy digest, Git ancestry and live configured CI for both R and A. Changed or unevaluable inputs block explicitly while preserving historical approval.",
    "Local Claude review and the controlling-session human decision remain forgeable process evidence. The control plane validates structure, ordering and assignment separation but must not claim cryptographic identity or authenticated GitHub approval from local records.",
    "Fourteen files are in the phase-2 fileset. The size is accepted for planning as a single cross-cutting security change because schema, kernel registration, validator, guarded runtime entry, dependency enforcement, portable distribution, focused tests, documentation, versioned evidence and generated lock must land atomically; implementation approval may still require splitting if review finds an independently safe boundary.",
    "framework/schemas/project.schema.json, runtime/handoff schemas, project manifests, templates, adapters and CI transport remain unchanged deliberately: evidence paths derive from documents.tasks, the existing runtime event shape is sufficient, completion reuses the existing live CI evaluator, and no new configuration source is introduced.",
    "Regenerate intellix.lock.json from the validated framework; never hand-edit its digest. No merge, release, deploy, credential provisioning, permissions, secrets, production action or additional branch is in scope."
  ],
