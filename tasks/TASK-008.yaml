    "The revised TASK-008 plan and exact fileset were explicitly approved by the human owner on 2026-09-22.",
    "This task deliberately does not add IN_REVIEW to APPROVED, approval evidence storage or evidence-aware dependency release. Those controls must land atomically in a later contract after these primitives exist.",
    "The kernel will own both dependency-satisfying states and guarded transition states; every dependency-satisfying state must be guarded. Missing, empty or malformed registries are blocking and have no code fallback.",
    "Runtime is defense in depth; the dispatcher must reject guarded targets before dependency, adapter or worktree activity and must not translate that rejection into a BLOCKED transition.",
    "CI evaluation itself must reject an empty required-check list even when invoked with a context that bypassed normal project validation; project.schema.json already enforces a non-empty set and is intentionally outside this fileset.",
