  "rollback": "Revert only the focused TASK-008 implementation commits on the authorized feature branch and regenerate the lock from the restored kernel; preserve review and CI evidence. Do not rewrite history or alter external permissions.",
  "notes": [
    "The original draft attempted to add guarded completion in one task. Independent review found that direct target-state dispatch, caller-selected stale revisions and forgeable local review records made that unsafe.",
