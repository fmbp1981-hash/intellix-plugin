{
  "schema_version": "1.0.0",
  "framework_version": "1.0.0",
  "name": "IntelliX Multi-Agent Engineering Framework",
  "normative": true,
  "principles": [
    "artifacts_over_chat",
    "one_normative_source",
    "vendor_neutral_core",
    "least_privilege_filesets",
    "independent_review",
    "deterministic_ci_is_final_arbiter",
    "human_approval_for_irreversible_risk",
    "observability_and_rollback_by_design"
  ],
  "artifact_flow": ["PRD", "ARCHITECTURE", "SPEC", "TASK_CONTRACT", "CODE", "EVIDENCE", "RELEASE"],
  "roles_directory": "framework/roles",
  "policies": {
    "git": "framework/policies/git.yaml",
    "security": "framework/policies/security.yaml",
    "testing": "framework/policies/testing.yaml",
    "deployment": "framework/policies/deployment.yaml"
  },
  "schemas": {
    "task": "framework/schemas/task.schema.json",
    "role": "framework/schemas/role.schema.json",
    "project": "framework/schemas/project.schema.json",
    "lock": "framework/schemas/lock.schema.json",
    "approval": "framework/schemas/approval.schema.json",
    "waiver": "framework/schemas/waiver.schema.json",
    "handoff": "framework/schemas/handoff.schema.json",
    "runtime": "framework/schemas/runtime.schema.json",
    "reservation": "framework/schemas/reservation.schema.json",
    "checkpoint": "framework/schemas/checkpoint.schema.json",
    "ci_evidence": "framework/schemas/ci-evidence.schema.json"
  },
  "control_plane": {
    "version": "1.0.0",
    "files": [
      "framework/validate.py",
      "framework/sync.py",
      "framework/runtime.py",
      "framework/dispatch.py",
      "framework/worktrees.py",
      "framework/adapters.py",
      "framework/ci.py"
    ]
  },
  "runtime": {
    "transitions": {
      "READY": ["IN_PROGRESS", "BLOCKED"],
      "IN_PROGRESS": ["IN_REVIEW", "BLOCKED"],
      "IN_REVIEW": ["IN_PROGRESS", "BLOCKED"],
      "CHANGES_REQUESTED": ["IN_PROGRESS", "BLOCKED"],
      "DRAFT": ["BLOCKED"],
      "READY_FOR_ARCH_REVIEW": ["BLOCKED"]
    }
  },
  "defaults": {
    "branch_strategy": "trunk_based_short_lived",
    "protected_branch": "main",
    "worktree_from_risk": "medium",
    "maximum_review_cycles": 3
  },
  "task_lifecycle": [
    "DRAFT", "READY_FOR_ARCH_REVIEW", "READY", "IN_PROGRESS", "BLOCKED",
    "IN_REVIEW", "CHANGES_REQUESTED", "APPROVED", "MERGED", "VERIFIED", "RELEASED"
  ],
  "risk_gates": {
    "low": ["schema", "lint", "tests", "independent_review"],
    "medium": ["schema", "fileset", "lint", "tests", "independent_review", "worktree"],
    "high": ["schema", "fileset", "lint", "tests", "security_review", "independent_review", "rollback_plan", "human_approval", "worktree"],
    "critical": ["schema", "fileset", "lint", "tests", "security_review", "independent_review", "rollback_plan", "human_approval", "staged_release", "worktree"]
  },
  "governance_profiles": {
    "micro": {"minimum_gates": ["schema", "tests"]},
    "standard": {"minimum_gates": ["schema", "lint", "tests", "independent_review"]},
    "regulated": {"minimum_gates": ["schema", "fileset", "lint", "tests", "security_review", "independent_review", "rollback_plan", "human_approval", "worktree"]}
  },
  "authority": [
    "framework/framework.yaml",
    "framework/policies/*.yaml",
    "framework/roles/*.yaml",
    "intellix.yaml",
    "docs/adr/*.md",
    "tasks/TASK-*.yaml",
    "AGENTS.md",
    "CLAUDE.md"
  ]
}
